name: Build with MSYS2

on:
  push:
    branches:
      - master
    paths-ignore:
      - '.github/workflows/build-msvs2022.yml'
      - '.github/workflows/build-msvs2026-wxmaster.yml'
      - '.github/workflows/build-online-docs.yml'
      - 'build/vcpkg/**'
      - 'docs/**'
      - 'ReadMe.md'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '.github/workflows/build-msvs2022.yml'
      - '.github/workflows/build-msvs2026-wxmaster.yml'
      - '.github/workflows/build-online-docs.yml'
      - 'build/vcpkg/**'
      - 'docs/**'
      - 'ReadMe.md'
  workflow_dispatch:

permissions:
  contents: read

# cancel the runs for the previous pushes to a pull request,
# runs for pushes to master are grouped by commit so none is skipped
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  wxMSW_VER: 3.2
  BUILD_DIR_PATH: build_cmake

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { sys: ucrt64,     runner: windows-2025    }
          - { sys: clang64,    runner: windows-2025    }
          - { sys: clangarm64, runner: windows-11-arm  }
    name: ${{ matrix.sys }}
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{matrix.sys}}
        update: true
        pacboy: >-
          toolchain:p
          cmake:p
          ninja:p
          catch:p
          wxwidgets${{ env.wxMSW_VER }}-msw:p

    # CMake from MSYS2 is a native Windows program, so it gets Windows paths
    - name: Set directories
      run: |
        echo "INSTALL_DIR_PATH=$(cygpath -m "$RUNNER_TEMP/wxAutoExcel-install")" >> $GITHUB_ENV
        echo "PACKAGE_TEST_BUILD_DIR_PATH=$(cygpath -m "$RUNNER_TEMP/package-test-build")" >> $GITHUB_ENV

    - name: Configure wxAutoExcel and tests
      run: |
        cmake -G Ninja -B $BUILD_DIR_PATH -DCMAKE_BUILD_TYPE=Release \
          -DwxAutoExcel_BUILD_SHARED=ON -DwxAutoExcel_BUILD_TESTS=ON \
          -DCMAKE_REQUIRE_FIND_PACKAGE_Catch2=ON \
          -DwxAutoExcel_BUILD_INSTALL=ON -DCMAKE_INSTALL_PREFIX="$INSTALL_DIR_PATH"

    # Excel is unavailable on hosted runners: compile and link, without running tests.
    - name: Build wxAutoExcel, examples, and tests
      run: |
        cmake --build $BUILD_DIR_PATH

    - name: Install wxAutoExcel
      run: |
        cmake --install $BUILD_DIR_PATH

    # Build and run a program using the installed package with find_package(),
    # it does not need Excel. wxWidgets is found with wx-config here.
    - name: Test the installed package
      run: |
        set -e
        cmake -G Ninja -S tests/package -B "$PACKAGE_TEST_BUILD_DIR_PATH" \
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$INSTALL_DIR_PATH"
        cmake --build "$PACKAGE_TEST_BUILD_DIR_PATH"
        PATH="$(cygpath -u "$INSTALL_DIR_PATH")/bin:$PATH" \
          "$(cygpath -u "$PACKAGE_TEST_BUILD_DIR_PATH")/wxAutoExcel_package_test.exe"
