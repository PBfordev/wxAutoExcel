name: Build with MSYS2

on:
  push:
    branches:
      - master
    paths-ignore:
      - '.github/workflows/build-msvs2022.yml'
      - '.github/workflows/build-msvs2026-wxmaster.yml'
      - '.github/workflows/build-online-docs.yml'
      - 'build/vcpkg/**'
      - 'docs/**'
      - 'util/**'
      - 'ReadMe.md'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '.github/workflows/build-msvs2022.yml'
      - '.github/workflows/build-msvs2026-wxmaster.yml'
      - '.github/workflows/build-online-docs.yml'
      - 'build/vcpkg/**'
      - 'docs/**'
      - 'util/**'
      - 'ReadMe.md'
  workflow_dispatch:

permissions:
  contents: read

# cancel the runs for the previous pushes to a pull request,
# runs for pushes to master are grouped by commit so none is skipped
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  wxMSW_VER: 3.2
  BUILD_DIR_PATH: build_cmake

jobs:
  build:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - { sys: ucrt64  }
          - { sys: clang64 }
    name: ${{ matrix.sys }}
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{matrix.sys}}
        update: true
        pacboy: >-
          toolchain:p
          cmake:p
          ninja:p
          catch:p
          wxwidgets${{ env.wxMSW_VER }}-msw:p

    - name: Configure wxAutoExcel and tests
      run: |
        cmake -G Ninja -B $BUILD_DIR_PATH -DCMAKE_BUILD_TYPE=Release \
          -DwxAutoExcel_BUILD_SHARED=ON -DwxAutoExcel_BUILD_TESTS=ON \
          -DCMAKE_REQUIRE_FIND_PACKAGE_Catch2=ON

    # Excel is unavailable on hosted runners: compile and link, without running tests.
    - name: Build wxAutoExcel, examples, and tests
      run: |
        cmake --build $BUILD_DIR_PATH
